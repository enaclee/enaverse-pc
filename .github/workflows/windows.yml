name: Build enaverse Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ENACORE runtime prerequisites
        run: python -m pip install numpy==2.3.5 websocket-client==1.9.0 "psutil>=5.9,<8"
      - name: Run regression checks
        run: |
          python -m compileall -q app.py paper.py core_host.py ai_provider.py
          python -m unittest discover -s tests -v
          node --check web/app.js
      - name: Obtain licensed local fonts
        shell: pwsh
        run: |
          npm install --prefix .font-build --no-save --ignore-scripts @fontsource/plus-jakarta-sans@5 @fontsource/jetbrains-mono@5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item .font-build/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2 web/plus-jakarta.woff2
          Copy-Item .font-build/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2 web/jetbrains.woff2
          Copy-Item .font-build/node_modules/@fontsource/plus-jakarta-sans/LICENSE web/PLUS-JAKARTA-LICENSE.txt
          Copy-Item .font-build/node_modules/@fontsource/jetbrains-mono/LICENSE web/JETBRAINS-LICENSE.txt
      - name: Assemble relocatable Windows distribution
        shell: pwsh
        run: |
          $base = python -c "import sys; print(sys.base_prefix)"
          $out = Join-Path $PWD "dist/enaverse"
          New-Item -ItemType Directory -Force "$out/runtime" | Out-Null
          Copy-Item "$base/*" "$out/runtime" -Recurse -Force
          Copy-Item app.py,paper.py,core_host.py,ai_provider.py,README.md,start.cmd "$out/"
          Copy-Item web "$out/web" -Recurse
          & "$out/runtime/python.exe" -c "import numpy,websocket,psutil; print(numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $out
          & "./runtime/python.exe" -c "import app,paper,core_host,ai_provider; print('portable imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Upload portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: enaverse-Windows-x64
          path: dist/enaverse/
          if-no-files-found: error
          retention-days: 30
